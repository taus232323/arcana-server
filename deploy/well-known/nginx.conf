server {
    listen 80;
    server_name _;

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        # Include MSC4143 rtc_foci so Element X can discover LiveKit without
        # hitting the authenticated /rtc/transports endpoint.
        return 200 '{"m.homeserver":{"base_url":"https://arcana.celesteai.ru"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://arcana.celesteai.ru"}]}';
    }

    location = /.well-known/matrix/server {
        default_type application/json;
        # Public host with working DNS + TLS (matrix.celesteai.ru has no DNS).
        return 200 '{"m.server":"arcana.celesteai.ru:443"}';
    }

    location = /.well-known/matrix/support {
        default_type application/json;
        return 404;
    }

    location / {
        return 404;
    }
}
