[global]
server_name = "celesteai.ru"
address = ["0.0.0.0"]
port = 8008
database_path = "/var/lib/continuwuity"
allow_registration = true
allow_federation = false
allow_unrestricted_user_directory_search = true
new_user_displayname_suffix = ""

# Force email verification during all registrations.
# SMTP is supplied from the local `.env` file, which is mounted into the
# Docker container by `deploy/docker-compose.yml`.
# See `.env.example` in the repository root for the required variables.
require_email_for_registration = true
require_email_for_token_registration = true

# Optional hardening:
# suspend_on_register = true
# recaptcha_site_key = "..."
# recaptcha_private_site_key = "..."

[global.well_known]
client = "https://arcana.celesteai.ru"
server = "matrix.celesteai.ru:443"

# Shown during registration / available to clients as policy documents.
[global.registration_terms.privacy_policy]
en = { name = "Privacy Policy", url = "https://arcana.celesteai.ru/privacy" }
ru = { name = "Политика конфиденциальности", url = "https://arcana.celesteai.ru/privacy" }

[global.registration_terms.terms_of_service]
en = { name = "Terms of use", url = "https://arcana.celesteai.ru/terms" }
ru = { name = "Условия использования", url = "https://arcana.celesteai.ru/terms" }

# Google Play review login: listed emails skip SMTP and accept a fixed 4-digit OTP
# (same format as real login codes). Set `code` via env on the host:
#   CONTINUWUITY_PLAY_REVIEW__CODE=XXXX
# Uncomment and fill after creating the review user + binding its email.
# [global.play_review]
# emails = ["play-review@celesteai.ru"]
# code = "XXXX"
