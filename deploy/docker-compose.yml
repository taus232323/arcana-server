services:
  continuwuity:
    image: ghcr.io/taus232323/arcana-server:main
    pull_policy: always
    container_name: arcana_homeserver
    command: /sbin/conduwuit --config /etc/continuwuity/continuwuity.toml
    restart: unless-stopped
    ports:
      - "127.0.0.1:6167:8008"
    volumes:
      - continuwuity_db:/var/lib/continuwuity
      - ./continuwuity.toml:/etc/continuwuity/continuwuity.toml:ro
      - ./continuwuity-resolv.conf:/etc/resolv.conf:ro
    env_file:
      - ../.env

  matrix-chat:
    image: vectorim/element-web:latest
    container_name: arcana_chat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:80"
    volumes:
      - ./element-config.json:/app/config.json:ro

  # Self-hosted Element Call SPA. Traefik should route call.celesteai.ru -> 127.0.0.1:3320
  # so web/widget calls stay on Arcana instead of call.element.io (Element accounts).
  element-call:
    image: ghcr.io/element-hq/element-call:latest
    container_name: arcana_element_call
    restart: unless-stopped
    ports:
      - "127.0.0.1:3320:8080"
    volumes:
      - ./element-call-config.json:/app/config.json:ro

  matrix-wellknown:
    image: nginx:alpine
    container_name: arcana_wellknown
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:80"
    volumes:
      - ./well-known/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./well-known:/usr/share/nginx/html/.well-known:ro

  # Matrix push gateway (FCM) for Arcana Android — routed via arcana.celesteai.ru/_matrix/push
  sygnal:
    image: matrixdotorg/sygnal:latest
    container_name: arcana_sygnal
    restart: unless-stopped
    environment:
      SYGNAL_CONF: /sygnal/sygnal.yaml
    entrypoint: ["python", "/sygnal/patch_and_run.py"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./sygnal/sygnal.yaml:/sygnal/sygnal.yaml:ro
      - ./sygnal/service-account.json:/sygnal/service-account.json:ro
      - ./sygnal/patch_and_run.py:/sygnal/patch_and_run.py:ro

  # Element Call / MatrixRTC: JWT exchange for LiveKit
  # LIVEKIT_KEY / LIVEKIT_SECRET must be set in repo-root .env (see .env.example).
  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    container_name: arcana_lk_jwt
    restart: unless-stopped
    environment:
      LIVEKIT_JWT_BIND: ":8081"
      LIVEKIT_URL: "wss://arcana.celesteai.ru"
      LIVEKIT_FULL_ACCESS_HOMESERVERS: "celesteai.ru"
    ports:
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "arcana.celesteai.ru:host-gateway"
      - "matrix.celesteai.ru:host-gateway"
    env_file:
      - ../.env

  # Element Call / MatrixRTC: LiveKit SFU (host networking for UDP media ports)
  # Requires a real file at deploy/livekit.yaml (copy from livekit.yaml.example).
  # If that path is missing, Docker creates a directory and LiveKit crashes with
  # "read /etc/livekit.yaml: is a directory".
  livekit:
    image: livekit/livekit-server:latest
    container_name: arcana_livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  continuwuity_db:
